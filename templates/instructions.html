{% extends "base.html" %}
{% block content %}
<section class="page-card">
  <div class="platform-label {{ platform.color }}">{{ platform.name }}</div>
  <h1>Como copiar o link do vídeo</h1>
  <p class="subtitle">Siga os passos abaixo:</p>

  <ol class="steps">
    {% for step in platform.steps %}
      <li>{{ step }}</li>
    {% endfor %}
  </ol>

  <a class="primary-button" href="{{ url_for('downloader', platform=key) }}">
    OK, já copiei o link
  </a>

  <a class="back-link" href="{{ url_for('home') }}">← Voltar</a>
</section>
{% endblock %}
